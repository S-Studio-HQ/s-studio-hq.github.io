<!doctype html>
<!--
  SStudio's passkey page (ADR 0011), served at https://s-studio-hq.github.io/authenticate/passkey (GitHub Pages,
  repo S-Studio-HQ/s-studio-hq.github.io). The source is site/ in SStudio - the outermost
  layer (ADR 0012): only browser_passkey.py knows it. Change it there, then run scripts/publish_site.py.
  Its script is assets/passkey.js: the names after "#" are PageKey, the modes PageMode
  (tests/utils/crypto/test_browser_passkey.py checks they match).

  The page gets everything from the "#" part of its address, which the browser never sends to the web server,
  asks the passkey, and sends the answer only to http://127.0.0.1:<port>/answer - the Python program that opened
  it - with its one-time token. Nothing is stored and nothing goes anywhere else; the Content-Security-Policy
  makes the browser hold the page to that: scripts and styles only from this site, answers only to 127.0.0.1.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src http://127.0.0.1:*; form-action http://127.0.0.1:*; base-uri 'none'">
<meta name="color-scheme" content="dark">
<title>SStudio passkey</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/glass.css">
</head>
<body>
<div class="light" aria-hidden="true"><span></span><span></span><span></span></div>
<main class="card glass">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="8" cy="15" r="4"/><path d="M11 12l9-9m-3 3l3 3m-6 0l2 2"/>
    </svg>
    SStudio
  </div>
  <h1 id="title">SStudio passkey</h1>
  <p id="help">SStudio asks your passkey for the secret that opens a main key.</p>
  <div class="choices">
    <button id="btnHere" class="choice" hidden>
      <span class="icon">
        <svg id="iconComputer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>
        <svg id="iconPhoneHere" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          aria-hidden="true" hidden><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
      </span>
      <span><strong id="hereTitle">This device</strong><small id="hereNote"></small></span>
    </button>
    <button id="btnPhone" class="choice" hidden>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>
        </svg>
      </span>
      <span><strong id="phoneTitle">iPhone</strong><small id="phoneNote"></small></span>
    </button>
  </div>
  <button id="btnCancel" class="quiet" hidden>Cancel - type the backup key instead</button>
  <div id="status" class="status" role="status">Reading the request...</div>
</main>
<script src="../assets/passkey.js"></script>
</body>
</html>
