<!doctype html>
<!--
  The first address of SStudio's passkey page (until 2026-10-16). It sends the browser on to authenticate/passkey with the same "#" part, which stays in the browser.
  Delete it once every computer runs an SStudio whose PageUrl is .../authenticate/passkey (the Mac and the
  Windows PC both updated past 2026-10-17): no older SStudio opens this address then.
  Source: site/ in SStudio.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>S-Studio</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/glass.css">
<script>location.replace("authenticate/passkey" + location.hash);</script>
</head>
<body>
<div class="light" aria-hidden="true"><span></span><span></span><span></span></div>
<main class="card glass">
  <h1>SStudio passkey</h1>
  <p>This page moved to <a href="authenticate/passkey">authenticate/passkey</a>.</p>
</main>
</body>
</html>
